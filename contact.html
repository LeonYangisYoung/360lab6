<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact | UTM Game Club</title><link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar md:navbar-expand bg-1"><div class="container"><a class="navbar-brand" href="index.html">UTM Game Club</a><button class="btn-solid theme-primary" id="menuOpen">Menu</button><div id="siteMenu" class="drawer"><button id="menuClose" aria-label="Close menu">×</button><a href="index.html">Home</a><a href="index.html#games">Games</a><a class="active" href="contact.html">Contact</a></div></div></nav>
<main class="container contact-page"><h1>Get in touch</h1><p>Want to join us or have a game suggestion? Send a message below.</p><form><div class="row g-3">
<div class="col-12 md:col-6 form-field"><label for="first">First name</label><input class="form-control" id="first" required></div>
<div class="col-12 md:col-6 form-field"><label for="last">Last name</label><input class="form-control" id="last" required></div>
<div class="col-12 md:col-6 form-field"><label for="email">Email</label><input class="form-control" type="email" id="email" placeholder="name@example.com" required></div>
<div class="col-12 md:col-6 form-field"><label for="reason">I'm interested in</label><select class="form-control" id="reason"><option>Joining the club</option><option>Game recommendations</option><option>Game development</option><option>Events</option></select></div>
<div class="col-12 form-field"><label for="message">Message</label><textarea class="form-control" id="message" rows="5"></textarea></div>
<div class="col-12 form-field"><label class="check" for="consent"><input type="checkbox" id="consent" required> I agree to be contacted about the club.</label></div>
<div class="col-12"><button class="btn-solid theme-primary" type="submit">Send message</button></div></div></form></main><footer class="container"><p>© 2026 UTM Game Club</p></footer>
<script type="module" src="js/bootstrap.bundle.min.js"></script><script type="module">
const m=document.querySelector("#siteMenu"),o=document.querySelector("#menuOpen");o.onclick=()=>m.classList.add("open");function close(){m.classList.remove("open")}document.querySelector("#menuClose").onclick=close;document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});document.querySelector("form").onsubmit=e=>{e.preventDefault();alert("Thanks for your message!");e.target.reset()};
</script></body></html>
